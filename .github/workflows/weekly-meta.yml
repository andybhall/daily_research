name: Weekly Meta-Run

# Sundays 2pm PT (21:00 UTC): review the week, flag harness drift, propose edits.
on:
  schedule:
    - cron: "0 21 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: weekly-meta
  cancel-in-progress: false

jobs:
  meta:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Run the meta-review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          mkdir -p .hunt
          claude -p "$(cat META.md)" \
            --allowedTools "WebSearch,WebFetch,Read,Write,Edit,Bash" \
            --dangerously-skip-permissions \
            --output-format text \
            | tee .hunt/meta-log.txt

      - name: Open meta issue
        if: hashFiles('.hunt/meta-issue-body.md') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="Weekly meta-review — $(date -u +%F)"
          gh issue create \
            --title "$TITLE" \
            --body-file .hunt/meta-issue-body.md \
            --label "dataset-hunt,meta" || \
          gh issue create --title "$TITLE" --body-file .hunt/meta-issue-body.md

      - name: Commit any meta notes
        run: |
          git config user.name "dataset-hunt-bot"
          git config user.email "dataset-hunt-bot@users.noreply.github.com"
          git add memos META.md FRONTIERS.md
          if git diff --cached --quiet; then
            echo "No meta changes to commit."
          else
            git commit -m "Weekly meta-review: $(date -u +%F)"
            git push
          fi
